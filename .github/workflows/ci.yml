name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- client.js
      - run: node --check client.js
      - name: bundle invariants
        run: |
          test "$(grep -c '__ModuleLoader__.load' client.js)" = "1"
          ! grep -q '@deepseek-ai/dsh-client-' client.js
      - name: release helper syntax
        run: |
          node --check scripts/check-public-tree.mjs
          node --check scripts/check-tarball.mjs
          node --check scripts/extract-release-notes.mjs
      - name: public tree manifest
        run: node scripts/check-public-tree.mjs
      - name: pack whitelist dry-run
        run: npm pack --dry-run

name: Bug report
description: Report a reproducible Punch Desk issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real session data, credentials, or personal absolute paths.
        Redact logs and screenshots before submitting.
  - type: input
    id: plugin-version
    attributes:
      label: Punch Desk version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      placeholder: "0.2.2-rc.5"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps that trigger the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      description: Paste the smallest redacted excerpt that shows the failure.
      render: text

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Notebook outer cover outline -->
  <rect x="3.5" y="2.5" width="17" height="19" rx="3" stroke-width="1.5" />
  <!-- Left binding spine line -->
  <line x1="8" y1="2.5" x2="8" y2="21.5" stroke-width="1.25" stroke-dasharray="1.5 1.5" />
  <!-- 3 Punch Holes -->
  <circle cx="5.75" cy="6.5" r="0.9" fill="currentColor" stroke="none" />
  <circle cx="5.75" cy="12" r="0.9" fill="currentColor" stroke="none" />
  <circle cx="5.75" cy="17.5" r="0.9" fill="currentColor" stroke="none" />
  <!-- Bookmark ribbon in top right -->
  <path d="M14 2.5v6l1.75-1.25 1.75 1.25V2.5" fill="currentColor" fill-opacity="0.2" stroke-width="1.2" />
  <!-- Checkmark -->
  <path d="M11 11.5l1.5 1.5 3.5-3.5" stroke-width="1.75" />
  <!-- Milestone note lines -->
  <line x1="11" y1="15.5" x2="17.5" y2="15.5" stroke-width="1.3" stroke-opacity="0.75" />
  <line x1="11" y1="18.5" x2="15" y2="18.5" stroke-width="1.3" stroke-opacity="0.5" />
</svg>
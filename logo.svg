<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="pdCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B4252" />
      <stop offset="100%" stop-color="#2E3440" />
    </linearGradient>
    <linearGradient id="pdRibbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBCB8B" />
      <stop offset="100%" stop-color="#D08770" />
    </linearGradient>
  </defs>
  <!-- Notebook cover background -->
  <rect x="3.5" y="2.5" width="17" height="19" rx="3" fill="url(#pdCoverGrad)" stroke="#4C566A" stroke-width="1.25" />
  <!-- Left binding spine line -->
  <line x1="8" y1="2.5" x2="8" y2="21.5" stroke="#88C0D0" stroke-width="1.25" stroke-dasharray="1.5 1.5" />
  <!-- 3 Punch Holes -->
  <circle cx="5.75" cy="6.5" r="0.9" fill="#81A1C1" />
  <circle cx="5.75" cy="12" r="0.9" fill="#81A1C1" />
  <circle cx="5.75" cy="17.5" r="0.9" fill="#81A1C1" />
  <!-- Bookmark ribbon in top right -->
  <path d="M14 2.5v6l1.75-1.25 1.75 1.25V2.5" fill="url(#pdRibbonGrad)" stroke="#D08770" stroke-width="1" stroke-linejoin="round" />
  <!-- Checkmark (Aurora green) -->
  <path d="M11 11.5l1.5 1.5 3.5-3.5" stroke="#A3BE8C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Milestone note lines (Snow storm & Frost) -->
  <line x1="11" y1="15.5" x2="17.5" y2="15.5" stroke="#ECEFF4" stroke-width="1.3" stroke-linecap="round" />
  <line x1="11" y1="18.5" x2="15" y2="18.5" stroke="#88C0D0" stroke-width="1.3" stroke-linecap="round" />
</svg>